name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --python '${{ matrix.python }}' --extra agent --extra gui
      - run: uv run --locked --python '${{ matrix.python }}' --extra agent --extra gui python -m pytest -q

  minimal-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --python 3.10 --no-dev
      - name: Import server and remote client without optional dependencies
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util
          import main
          from src.server import TelemetryHTTPServer
          from src.remote import RemoteProcessSource
          assert importlib.util.find_spec('psutil') is None
          assert importlib.util.find_spec('pygame') is None
          PY
      - run: .venv/bin/python main.py --help

  browser-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.mjs
      - run: node --check web/renderer.mjs
      - run: node --test tests/web/*.test.mjs
